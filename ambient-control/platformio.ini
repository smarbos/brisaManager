; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<sound_sensor_test/>
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; Standalone bring-up sketch for the mic amp only (no WiFi, no other sensors) - see
; src/sound_sensor_test/main.cpp. Flash it with:
;   pio run -e sound-sensor-test --target upload --upload-port /dev/ttyUSB0
[env:sound-sensor-test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<sound_sensor_test/>
