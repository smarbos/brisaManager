name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, admin-web, guest-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test

  # Gated on the "production" GitHub Environment: configure it under
  # Settings > Environments with a required reviewer, so a push to main builds and tests
  # immediately but waits for a manual approval click before it touches the server — see
  # docs/deploy-github-actions-setup.md for the one-time setup (environment, secrets, and the
  # server-side authorized_keys entry).
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        # The server's host key comes from a secret captured out-of-band, never from
        # ssh-keyscan at deploy time — scanning here would trust whatever answers, which is
        # exactly what StrictHostKeyChecking is supposed to rule out.
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is not set — see docs/deploy-github-actions-setup.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Runs on the server exactly what the README's manual deploy steps already document —
      # this workflow only automates *triggering* that, not the steps themselves.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "ssh-keygen -F github.com -f ~/.ssh/known_hosts >/dev/null 2>&1 || ssh-keyscan -H github.com >> ~/.ssh/known_hosts; \
             git config --global --get-all safe.directory | grep -qxF '$DEPLOY_PATH' || git config --global --add safe.directory '$DEPLOY_PATH'; \
             cd '$DEPLOY_PATH' && git pull origin main && \
             export VITE_COMMIT_HASH=\$(git rev-parse --short HEAD) && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build && docker compose exec -T api npx prisma migrate deploy"
