server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # __API_URL__ is replaced with VITE_API_URL at image build time (see Dockerfile's prod
    # stage). img-src includes it because receipt thumbnails are plain <img src> URLs on the
    # API. style-src allows 'unsafe-inline' for React style={...} attributes; scripts stay 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: __API_URL__; connect-src 'self' __API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The page URL carries the guest's confirmation token (/r/:token) — never send it anywhere.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
