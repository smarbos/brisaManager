server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # __API_URL__ is replaced with VITE_API_URL at image build time (see Dockerfile's prod
    # stage), so connect-src always matches the API origin the bundle was built against.
    # style-src allows 'unsafe-inline' for React style={...} attributes; scripts stay 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' __API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
